<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet House - Online Menu & Ordering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-12 min-h-screen">

    <!-- TOP HEADER -->
    <header class="glass-header sticky top-0 z-40 border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="store-logo" class="w-10 h-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-xl shadow-md">
                    G
                </div>
                <div>
                    <h1 id="store-name" class="font-bold text-slate-900 leading-tight text-lg">Gourmet House</h1>
                    <p id="store-greeting" class="text-xs text-slate-500">Delicious food delivered fresh</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 pt-4">

        <!-- CUSTOMER VIEW -->
        <div id="customer-view" class="space-y-4">
            
            <!-- SEARCH BAR -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search-input" oninput="renderCustomerMenu()" placeholder="Search dishes..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-sm">
            </div>

            <!-- CATEGORY PILLS -->
            <div id="category-pills" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <!-- Rendered dynamically -->
            </div>

            <!-- MENU ITEMS LIST -->
            <div id="menu-items-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- FLOATING CART BAR -->
    <div id="floating-cart-bar" class="fixed bottom-0 left-0 right-0 p-4 bg-transparent pointer-events-none z-30">
        <div class="max-w-4xl mx-auto">
            <button onclick="toggleCartDrawer(true)" class="pointer-events-auto w-full bg-emerald-600 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center hover:bg-emerald-700 transition transform active:scale-98">
                <div class="flex items-center gap-3">
                    <span id="cart-count-badge" class="bg-white text-emerald-700 text-xs font-extrabold w-6 h-6 rounded-full flex items-center justify-center">0</span>
                    <span class="font-bold text-base">View Cart</span>
                </div>
                <span id="cart-total-badge" class="font-bold text-lg">$0.00</span>
            </button>
        </div>
    </div>

    <!-- CART DRAWER / OVERLAY -->
    <div id="cart-drawer-overlay" class="fixed inset-0 bg-slate-900/40 z-50 hidden transition-opacity" onclick="toggleCartDrawer(false)">
        <div class="fixed right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <!-- Drawer Header -->
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-emerald-600"></i> Your Order
                </h3>
                <button onclick="toggleCartDrawer(false)" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Drawer Cart Items -->
            <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
                <!-- Rendered dynamically -->
            </div>

            <!-- Customer Details & Checkout Footer -->
            <div class="p-4 border-t bg-slate-50 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Table Number or Delivery Address</label>
                    <input type="text" id="checkout-note" placeholder="e.g. Table 4 or 123 Main St" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="flex justify-between items-center pt-1 font-bold text-slate-800">
                    <span>Total Amount:</span>
                    <span id="cart-drawer-total" class="text-xl text-emerald-600">$0.00</span>
                </div>

                <button onclick="sendOrderViaWhatsApp()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg flex justify-center items-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    Send Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- ITEM MODAL (CUSTOMIZATION) -->
    <div id="item-modal-overlay" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div id="modal-content" class="overflow-y-auto flex-1 p-6">
                <!-- Dynamic Content for Customer Customization -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const DEFAULT_STORE = {
            name: "Gourmet House",
            greeting: "Fresh & Artisanal Dishes",
            phone: "1234567890",
            currency: "$",
            categories: ["All", "Burgers", "Pizzas", "Drinks", "Desserts"],
            items: [
                {
                    id: "1",
                    name: "Classic Cheeseburger",
                    description: "Juicy beef patty, cheddar cheese, crisp lettuce, tomato & special sauce.",
                    price: 9.99,
                    category: "Burgers",
                    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&auto=format&fit=crop&q=80",
                    optionGroups: [
                        {
                            name: "Choose Size",
                            type: "single",
                            options: [
                                { name: "Single Patty", price: 0 },
                                { name: "Double Patty", price: 3.50 }
                            ]
                        },
                        {
                            name: "Add Extras",
                            type: "multiple",
                            options: [
                                { name: "Extra Bacon", price: 1.50 },
                                { name: "Caramelized Onions", price: 0.75 }
                            ]
                        }
                    ]
                },
                {
                    id: "2",
                    name: "Margherita Pizza",
                    description: "San Marzano tomatoes, fresh mozzarella, basil, and olive oil.",
                    price: 12.50,
                    category: "Pizzas",
                    image: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=400&auto=format&fit=crop&q=80",
                    optionGroups: []
                },
                {
                    id: "3",
                    name: "Iced Caramel Macchiato",
                    description: "Espresso combined with caramel syrup, milk, and ice.",
                    price: 4.75,
                    category: "Drinks",
                    image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=400&auto=format&fit=crop&q=80",
                    optionGroups: []
                }
            ]
        };

        let store = JSON.parse(localStorage.getItem('wh_store_data')) || DEFAULT_STORE;
        let cart = JSON.parse(localStorage.getItem('wh_cart_data')) || [];
        let activeCategory = "All";

        document.addEventListener("DOMContentLoaded", () => {
            renderHeader();
            renderCategoryPills();
            renderCustomerMenu();
            updateCartBadges();
        });

        function saveCart() {
            localStorage.setItem('wh_cart_data', JSON.stringify(cart));
            updateCartBadges();
        }

        function renderHeader() {
            document.getElementById('store-name').textContent = store.name;
            document.getElementById('store-greeting').textContent = store.greeting;
            document.getElementById('store-logo').textContent = store.name.charAt(0).toUpperCase();
        }

        function renderCategoryPills() {
            const container = document.getElementById('category-pills');
            container.innerHTML = store.categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition ${
                    activeCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryPills();
            renderCustomerMenu();
        }

        function renderCustomerMenu() {
            const container = document.getElementById('menu-items-container');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();

            const filteredItems = store.items.filter(item => {
                const matchesCategory = activeCategory === "All" || item.category === activeCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchKeyword) || item.description.toLowerCase().includes(searchKeyword);
                return matchesCategory && matchesSearch;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-400">
                        <i class="fa-solid fa-utensils text-4xl mb-2"></i>
                        <p>No dishes found matching your criteria.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filteredItems.map(item => `
                <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div class="flex p-3 gap-3">
                        ${item.image ? `<img src="${item.image}" class="w-24 h-24 object-cover rounded-xl flex-shrink-0" alt="${item.name}">` : ''}
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-slate-900 text-base leading-snug truncate">${item.name}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mt-1">${item.description}</p>
                            <div class="font-bold text-emerald-600 text-base mt-2">${store.currency}${item.price.toFixed(2)}</div>
                        </div>
                    </div>
                    <div class="px-3 pb-3 pt-0">
                        <button onclick="openCustomerCustomizationModal('${item.id}')" class="w-full py-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-sm font-semibold rounded-xl border border-slate-200 flex items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-plus text-xs"></i> Add to Order
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openCustomerCustomizationModal(itemId) {
            const item = store.items.find(i => i.id === itemId);
            if (!item) return;

            const modal = document.getElementById('item-modal-overlay');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-slate-900 text-xl">${item.name}</h3>
                            <p class="text-sm text-slate-500">${item.description}</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>

                    ${item.image ? `<img src="${item.image}" class="w-full h-44 object-cover rounded-xl" alt="${item.name}">` : ''}

                    <form id="customization-form" class="space-y-4 pt-2">
                        ${(item.optionGroups || []).map((grp, gIdx) => `
                            <div class="border-t pt-3">
                                <label class="block font-bold text-sm text-slate-800 mb-2">${grp.name}</label>
                                <div class="space-y-2">
                                    ${grp.options.map((opt, oIdx) => `
                                        <label class="flex justify-between items-center p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
                                            <div class="flex items-center gap-2">
                                                <input type="${grp.type === 'single' ? 'radio' : 'checkbox'}" 
                                                       name="grp_${gIdx}" 
                                                       value="${opt.name}" 
                                                       data-price="${opt.price}" 
                                                       ${grp.type === 'single' && oIdx === 0 ? 'checked' : ''}
                                                       class="text-emerald-600 focus:ring-emerald-500">
                                                <span class="text-slate-700">${opt.name}</span>
                                            </div>
                                            <span class="text-xs font-semibold text-slate-500">+${store.currency}${opt.price.toFixed(2)}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}

                        <div class="border-t pt-3">
                            <label class="block font-bold text-sm text-slate-800 mb-1">Special Instructions</label>
                            <input type="text" id="special-instructions" placeholder="e.g. Extra sauce, no onions..." class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>

                        <div class="border-t pt-4 flex items-center justify-between">
                            <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden">
                                <button type="button" onclick="adjustModalQty(-1)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">-</button>
                                <span id="modal-qty" class="px-4 font-bold text-slate-800">1</span>
                                <button type="button" onclick="adjustModalQty(1)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">+</button>
                            </div>

                            <button type="button" onclick="addToCart('${item.id}')" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">
                                Add to Cart
                            </button>
                        </div>
                    </form>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function adjustModalQty(delta) {
            const qtySpan = document.getElementById('modal-qty');
            let qty = parseInt(qtySpan.textContent) + delta;
            if (qty < 1) qty = 1;
            qtySpan.textContent = qty;
        }

        function closeModal() {
            document.getElementById('item-modal-overlay').classList.add('hidden');
        }

        function addToCart(itemId) {
            const item = store.items.find(i => i.id === itemId);
            const qty = parseInt(document.getElementById('modal-qty').textContent);
            const notes = document.getElementById('special-instructions').value.trim();

            const selectedOptions = [];
            let optionsTotalPrice = 0;

            const form = document.getElementById('customization-form');
            const inputs = form.querySelectorAll('input[type="radio"]:checked, input[type="checkbox"]:checked');

            inputs.forEach(input => {
                const optPrice = parseFloat(input.dataset.price) || 0;
                selectedOptions.push({ name: input.value, price: optPrice });
                optionsTotalPrice += optPrice;
            });

            const cartItem = {
                cartItemId: Date.now().toString(),
                id: item.id,
                name: item.name,
                unitPrice: item.price + optionsTotalPrice,
                qty: qty,
                options: selectedOptions,
                notes: notes
            };

            cart.push(cartItem);
            saveCart();
            closeModal();
            toggleCartDrawer(true);
        }

        function updateCartBadges() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);

            document.getElementById('cart-count-badge').textContent = totalQty;
            document.getElementById('cart-total-badge').textContent = `${store.currency}${totalPrice.toFixed(2)}`;
            document.getElementById('cart-drawer-total').textContent = `${store.currency}${totalPrice.toFixed(2)}`;
        }

        function toggleCartDrawer(open) {
            const drawer = document.getElementById('cart-drawer-overlay');
            if (open) {
                renderCartItems();
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-list');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center text-slate-400">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-2"></i>
                        <p>Your order is empty.</p>
                    </div>`;
                return;
            }

            container.innerHTML = cart.map((ci, index) => `
                <div class="pt-3 first:pt-0">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${ci.name}</h4>
                            <div class="text-xs text-slate-500">
                                ${ci.options.map(o => `+ ${o.name}`).join(', ')}
                                ${ci.notes ? `<div class="italic text-slate-400">Note: ${ci.notes}</div>` : ''}
                            </div>
                        </div>
                        <span class="font-bold text-slate-900 text-sm">${store.currency}${(ci.unitPrice * ci.qty).toFixed(2)}</span>
                    </div>

                    <div class="flex items-center justify-between mt-2">
                        <div class="flex items-center border rounded-lg">
                            <button onclick="updateCartQty(${index}, -1)" class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 font-bold text-xs">-</button>
                            <span class="px-2 text-xs font-semibold">${ci.qty}</span>
                            <button onclick="updateCartQty(${index}, 1)" class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 font-bold text-xs">+</button>
                        </div>
                        <button onclick="removeCartItem(${index})" class="text-xs text-red-500 hover:underline">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function updateCartQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            renderCartItems();
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            saveCart();
            renderCartItems();
        }

        function sendOrderViaWhatsApp() {
            if (cart.length === 0) {
                alert("Please add items to your order first!");
                return;
            }

            const note = document.getElementById('checkout-note').value.trim();
            const totalPrice = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);

            let msg = `*NEW ORDER - ${store.name}*\n`;
            msg += `------------------------------\n`;

            cart.forEach(item => {
                msg += `• *${item.qty}x ${item.name}* - ${store.currency}${(item.unitPrice * item.qty).toFixed(2)}\n`;
                if (item.options.length > 0) {
                    msg += `   Opts: ${item.options.map(o => o.name).join(', ')}\n`;
                }
                if (item.notes) {
                    msg += `   Note: ${item.notes}\n`;
                }
            });

            msg += `------------------------------\n`;
            msg += `*Total Amount:* ${store.currency}${totalPrice.toFixed(2)}\n`;
            if (note) {
                msg += `*Table / Address:* ${note}\n`;
            }

            const encodedMsg = encodeURIComponent(msg);
            const targetPhone = store.phone.replace(/[^0-9]/g, '');
            const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodedMsg}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
